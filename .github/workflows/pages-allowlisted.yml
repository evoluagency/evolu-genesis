name: Genesis public allowlisted site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-public-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block private files committed to the public Genesis repository
        run: npm run verify:public-repo
      - name: Install TypeScript without repository lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: TypeScript and provider contract gates
        run: npm run typecheck && npm run test:adapters
      - name: Build and verify public allowlist
        run: npm run build:public
      - name: Upload allowlisted output (never repository root)
        uses: actions/upload-pages-artifact@v4
        with:
          path: .evolu-public-dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy allowlisted artifact
        id: publish
        uses: actions/deploy-pages@v4
